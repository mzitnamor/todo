<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="To-do">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>To-do</title>
<style>
:root{
  --bg:#000; --fg:#e8e8e6; --dim:#6b6b68; --dimmer:#3a3a38; --line:#161616;
  --tlg:#a9ad72; --cel:#f4b6c8; --bth:#b9a8ec;
  --dig:#4fd1e0; --u1:#ffad1f; --u2:#ff4545; --ok:#3ecf6e;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--fg)}
body{font:14px/1.25 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
  padding:calc(env(safe-area-inset-top) + 6px) 12px calc(env(safe-area-inset-bottom) + 150px);
  -webkit-user-select:none;user-select:none;overflow-x:hidden}
header{display:flex;align-items:center;gap:8px;height:22px;margin-bottom:4px}
header b{font:700 11px/1 var(--mono);letter-spacing:.14em;color:var(--dim)}
header .sp{flex:1}
#cnt{font:11px/1 var(--mono);color:var(--dim)}
#dot{width:9px;height:9px;border-radius:50%;background:var(--dimmer);border:6px solid transparent;box-sizing:content-box;margin-right:-6px}
#dot.ok{background:var(--ok)} #dot.pend{background:var(--u1)} #dot.err{background:var(--u2)}
#note{font:12px/1.3 var(--mono);color:var(--dig);border-left:2px solid var(--dig);padding:2px 0 2px 7px;margin:2px 0 6px}
#note:empty{display:none}
.day{display:flex;align-items:baseline;gap:8px;margin:10px 0 2px;padding-bottom:3px;border-bottom:1px solid var(--dimmer)}
.day h2{font:700 12px/1 var(--mono);letter-spacing:.12em}
.day span{font:12px/1 var(--mono);color:var(--dim);flex:1}
.day i{font:normal 11px/1 var(--mono);color:var(--dim)}
.day.tmr h2{color:#bdbdb9}
.day.fold{cursor:pointer}
.slot{font:600 9.5px/1 var(--mono);letter-spacing:.14em;color:var(--dim);margin:7px 0 1px 24px}
.row{display:flex;align-items:center;min-height:27px;border-bottom:1px solid var(--line)}
.ck{width:24px;height:27px;display:flex;align-items:center;flex:none}
.ck::before{content:"";width:12px;height:12px;border-radius:50%;border:1.5px solid #555}
.u1 .ck::before{border-color:var(--u1);background:rgba(255,173,31,.18)}
.u2 .ck::before{border-color:var(--u2);background:rgba(255,69,69,.3)}
.done .ck::before{border-color:#333;background:#333}
.tag{font:600 9.5px/1 var(--mono);letter-spacing:.04em;width:28px;flex:none}
.tag.T{color:var(--tlg)} .tag.C{color:var(--cel)} .tag.B{color:var(--bth)}
.at{font:700 12px/1 var(--mono);color:var(--dig);width:13px;flex:none}
.tt{flex:1;padding:5px 0;word-break:break-word}
.u2 .tt{color:#ff8a8a}
.u1 .tt::before{content:"! ";color:var(--u1);font:700 12px var(--mono)}
.u2 .tt::before{content:"‼ ";color:var(--u2);font:700 12px var(--mono)}
.late{font:600 9.5px/1 var(--mono);color:var(--u1);margin-left:5px;letter-spacing:.05em}
.done .tt{color:var(--dimmer);text-decoration:line-through}
.done .tt::before{content:none}
.done .tag,.done .at,.done .late{opacity:.3}
.row.edit{background:#141414}
.empty{font:12px var(--mono);color:var(--dimmer);padding:4px 0 2px 24px}
.date{font:10px var(--mono);color:var(--dim);margin-left:6px}
.hd{width:30px;height:27px;flex:none;display:flex;align-items:center;justify-content:flex-end;touch-action:none;cursor:grab}
.hd::before{content:"";width:14px;height:2px;border-radius:1px;background:#3d3d3b;box-shadow:0 -4px 0 #3d3d3b,0 4px 0 #3d3d3b}
.slot.emp,.dz{display:none}
.dragging .slot.emp{display:block}
.dragging .dz{display:flex}
.dragging .empty{display:none}
.dz{height:24px;align-items:center;margin:2px 0 2px 24px;padding-left:8px;border:1px dashed #2e2e2e;border-radius:6px;font:10px var(--mono);color:#444;letter-spacing:.08em}
.slot.hov{color:var(--dig)} .dz.hov{border-color:var(--dig);color:var(--dig);background:rgba(79,209,224,.07)}
#stbyH.hov h2{color:var(--dig)!important}
.row.src{opacity:.25}
.ghost{position:fixed;z-index:20;pointer-events:none;background:#1b1b1b;border:1px solid #3a3a3a;border-radius:7px;padding:0 4px;
  box-shadow:0 8px 24px rgba(0,0,0,.7);transform:scale(1.02)}
.dragging{-webkit-user-select:none;user-select:none}
.dragging #bar{visibility:hidden}
#trash{display:none;position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 26px - var(--gap,0px));width:64px;height:64px;margin-left:-32px;border-radius:50%;
  align-items:center;justify-content:center;color:#bbb;background:#1a1a1a;border:1px solid #333;z-index:15;transition:transform .12s,background .12s}
.dragging #trash{display:flex}
#trash.hov{background:var(--u2);color:#fff;border-color:var(--u2);transform:scale(1.25)}
/* bottom bar */
#bar{position:fixed;left:0;right:0;bottom:calc(-1 * var(--gap,0px));background:rgba(10,10,10,.96);backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);border-top:1px solid #222;padding:7px 10px max(8px,calc(env(safe-area-inset-bottom) - 12px))}
#inrow{display:flex;gap:6px;align-items:center}
#in{flex:1;background:#171717;border:1px solid #2a2a2a;border-radius:8px;color:var(--fg);
  font:16px/1.2 -apple-system,system-ui,sans-serif;padding:7px 9px;outline:none;-webkit-user-select:text;user-select:text;resize:none;height:36px}
#in:focus{border-color:#444}
#del{display:none;font:700 11px var(--mono);color:var(--u2);padding:0 4px;height:36px;background:none;border:0}
.editing #del{display:block}
#inwrap{flex:1;position:relative;display:flex}
#inwrap #in{padding-right:40px}
#go{position:absolute;right:4px;top:50%;margin-top:-14px;width:28px;height:28px;border-radius:50%;border:0;padding:0;
  background:#2a2a2a;color:#666;font:400 20px/28px -apple-system,system-ui,sans-serif;text-align:center;touch-action:manipulation;transition:background .12s,color .12s}
#go.ready{background:var(--fg);color:#000}
.editing #go{font:700 14px/28px var(--mono)}
#chips{margin-top:7px;display:flex;flex-direction:column;gap:6px}
.crow{display:flex;gap:5px}
.chip{--c:#cfcfcb;flex:1 1 0;min-width:0;height:40px;border-radius:9px;font:700 13px/1 var(--mono);letter-spacing:.02em;
  color:color-mix(in srgb,var(--c) 78%,#000);background:color-mix(in srgb,var(--c) 9%,#0a0a0a);
  border:1px solid color-mix(in srgb,var(--c) 26%,#0a0a0a);touch-action:manipulation}
.chip.g{margin-left:9px}
.chip.on{color:#000;background:var(--c);border-color:var(--c)}
/* settings */
#set{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:9;padding:calc(env(safe-area-inset-top) + 40px) 20px;font:12px/1.5 var(--mono);color:#aaa}
#set.show{display:block}
#set input{width:100%;background:#151515;border:1px solid #333;color:#eee;font:14px var(--mono);padding:8px;border-radius:6px;margin:4px 0 12px;-webkit-user-select:text;user-select:text}
#set button{font:600 12px var(--mono);background:#222;color:#eee;border:1px solid #333;border-radius:6px;padding:8px 12px;margin-right:6px}
#set .k{color:#666}
</style>
</head>
<body>
<header><b>TO-DO</b><span class="sp"></span><span id="cnt"></span><span id="dot" title="sync"></span></header>
<div id="note"></div>
<main id="list"></main>

<div id="bar">
  <div id="inrow"><div id="inwrap"><input id="in" placeholder="Add…  (codes: c t b ! !! @ m a e tm s)" autocomplete="off" autocorrect="on" enterkeyhint="done"><button id="go" aria-label="Add">+</button></div><button id="del">DEL</button></div>
  <div id="chips">
    <div class="crow">
      <button class="chip" data-k="o" data-v="T" style="--c:var(--tlg)">TLG</button><button class="chip" data-k="o" data-v="C" style="--c:var(--cel)">CEL</button><button class="chip" data-k="o" data-v="B" style="--c:var(--bth)">BTH</button>
      <button class="chip g" data-k="u" data-v="1" style="--c:var(--u1)">!</button><button class="chip" data-k="u" data-v="2" style="--c:var(--u2)">‼</button>
      <button class="chip g" data-k="d" data-v="1" style="--c:var(--dig)">@</button>
    </div>
    <div class="crow">
      <button class="chip" data-k="s" data-v="">ANY</button><button class="chip" data-k="s" data-v="m">M</button><button class="chip" data-k="s" data-v="a">A</button><button class="chip" data-k="s" data-v="e">E</button>
      <button class="chip g" data-k="w" data-v="0">TOD</button><button class="chip" data-k="w" data-v="1">TMR</button><button class="chip" data-k="w" data-v="s">SB</button>
    </div>
  </div>
</div>

<div id="trash"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6"/></svg></div>
<div id="set">
  <div style="color:#eee;font-weight:700;margin-bottom:14px">SYNC SETUP</div>
  <div class="k">Data repo (owner/name)</div><input id="sRepo" placeholder="you/todo-data" autocapitalize="off" autocorrect="off">
  <div class="k">Key (GitHub token)</div><input id="sTok" placeholder="github_pat_…" autocapitalize="off" autocorrect="off" type="password">
  <button id="sSave">SAVE</button><button id="sSync">SYNC NOW</button><button id="sClose">CLOSE</button>
  <div id="sInfo" style="margin-top:16px"></div>
</div>

<script>
"use strict";
/* ---------- time (Doha) ---------- */
const TZ="Asia/Qatar";
const fmtISO=new Intl.DateTimeFormat("en-CA",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit"});
const fmtLbl=new Intl.DateTimeFormat("en-GB",{timeZone:TZ,weekday:"short",day:"2-digit",month:"short"});
const dISO=(o=0)=>fmtISO.format(new Date(Date.now()+o*864e5));
const dLbl=(o=0)=>fmtLbl.format(new Date(Date.now()+o*864e5)).replace(",","").toUpperCase();
const isoLbl=iso=>fmtLbl.format(new Date(iso+"T12:00:00+03:00")).replace(",","").toUpperCase();

/* ---------- state ---------- */
const LS="todo.v1", VER="v10", DEF_REPO="mzitnamor/todo-data";
let S=load();            // {v,items:[],note:{t,up}}
let cfg=loadCfg();       // {repo,tok}
let dirty=localStorage.getItem(LS+".dirty")==="1";
let lastSync=+localStorage.getItem(LS+".last")||0;
let editId=null, man={}; // manual chip overrides
let stbyOpen=false;

function load(){try{const s=JSON.parse(localStorage.getItem(LS));if(s&&s.items)return s}catch(e){}return{v:1,items:[],note:{t:"",up:0}}}
function loadCfg(){try{return JSON.parse(localStorage.getItem(LS+".cfg"))}catch(e){return null}}
function save(){try{localStorage.setItem(LS,JSON.stringify(S));localStorage.setItem(LS+".dirty",dirty?"1":"0")}catch(e){}}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const live=()=>S.items.filter(i=>!i.del);
function touch(i){i.up=Date.now();dirty=true}
function commit(){save();render();queueSync()}

/* ---------- housekeeping: rollover + 24h purge ---------- */
function tidy(){
  const today=dISO(), now=Date.now(); let ch=false;
  const n0=S.items.length; S.items=S.items.filter(i=>!/github_pat_|TODOKEY/i.test(i.t||"")); if(S.items.length!==n0)ch=true;
  for(const i of S.items){
    if(i.del){continue}
    if(i.done && now-i.done>864e5){i.del=1;touch(i);ch=true;continue}
    if(!i.done && i.day && i.day<today){i.day=today;i.late=1;touch(i);ch=true}
  }
  const before=S.items.length;
  S.items=S.items.filter(i=>!(i.del && now-i.up>14*864e5));
  if(S.items.length!==before)ch=true;
  if(ch)save();
  return ch;
}

/* ---------- shorthand ---------- */
const CODES={c:["o","C"],t:["o","T"],b:["o","B"],"!":["u",1],"!!":["u",2],"‼":["u",2],"@":["d",1],d:["d",1],
  m:["s","m"],a:["s","a"],e:["s","e"],tm:["w","1"],s:["w","s"],stby:["w","s"],tod:["w","0"]};
function parse(txt){
  const w=txt.trim().split(/\s+/); const f={};
  while(w.length>1){const k=w[w.length-1].toLowerCase(); if(!CODES[k])break; const [a,b]=CODES[k]; if(!(a in f))f[a]=b; w.pop()}
  return {title:w.join(" "),f};
}
function fields(){const p=parse(inp.value);return {title:p.title,f:Object.assign({o:"",u:0,d:0,s:"",w:"0"},p.f,man)}}

/* ---------- render ---------- */
const $=s=>document.querySelector(s), list=$("#list"), inp=$("#in");
const SL=[["","ANYTIME"],["m","MORNING"],["a","AFTERNOON"],["e","EVENING"]];
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function sortRows(a,b){
  if(!!a.done!==!!b.done)return a.done?1:-1;
  if(a.done)return a.done-b.done;
  if((b.u||0)!==(a.u||0))return (b.u||0)-(a.u||0);
  return (a.cr||0)-(b.cr||0);
}
function row(i,extra="",dk=""){
  return `<div class="row${i.u?" u"+i.u:""}${i.done?" done":""}${i.id===editId?" edit":""}" data-id="${i.id}"${dk?` data-drop="${dk}"`:""}>
<span class="ck"></span><span class="tag ${i.o||""}">${i.o==="T"?"TLG":i.o==="C"?"CEL":i.o==="B"?"BTH":""}</span><span class="at">${i.d?"@":""}</span><span class="tt">${esc(i.t)}${i.late&&!i.done?'<span class="late">(LATE)</span>':""}${extra}</span><span class="hd"></span></div>`;
}
function dayBlock(items,cls,name,lbl,off){
  const open=items.filter(i=>!i.done).length;
  let h=`<div class="day ${cls}"><h2>${name}</h2><span>${lbl}</span><i>${open}/${items.length}</i></div>`;
  if(!items.length)h+=`<div class="empty">—</div>`;
  for(const [k,n] of SL){
    const g=items.filter(i=>(i.slot||"")===k).sort(sortRows), dk=off+"|"+k;
    if(!g.length){h+=`<div class="slot emp" data-drop="${dk}">${n}</div><div class="dz" data-drop="${dk}">drop here</div>`;continue}
    h+=`<div class="slot" data-drop="${dk}">${n}</div>`+g.map(i=>row(i,"",dk)).join("");
  }
  return h;
}
function render(){
  if(drag){drag.pending=true;return}
  tidy();
  const t=dISO(),tm=dISO(1),L=live();
  const today=L.filter(i=>i.day&&(i.day===t||(i.done&&i.day<t)));
  const tmr=L.filter(i=>i.day===tm);
  const later=L.filter(i=>i.day&&i.day>tm).sort((a,b)=>a.day<b.day?-1:a.day>b.day?1:sortRows(a,b));
  const stby=L.filter(i=>!i.day).sort(sortRows);
  let h=dayBlock(today,"tod","TODAY",dLbl(0),"0")+dayBlock(tmr,"tmr","TOMORROW",dLbl(1),"1");
  if(later.length){h+=`<div class="day tmr"><h2>LATER</h2><span></span><i>${later.length}</i></div>`+later.map(i=>row(i,`<span class="date">${isoLbl(i.day)}</span>`)).join("")}
  h+=`<div class="day fold" id="stbyH" data-drop="s|"><h2 style="color:var(--dim)">STBY ${stbyOpen?"▾":"▸"}</h2><span></span><i>${stby.filter(i=>!i.done).length}</i></div>`;
  if(stbyOpen)h+=stby.length?stby.map(i=>row(i,"","s|")).join(""):`<div class="empty">—</div>`;
  list.innerHTML=h;
  $("#cnt").textContent=`${today.filter(i=>!i.done).length} left`;
  $("#note").textContent=(S.note&&S.note.t)||"";
  paintChips();
}
function paintChips(){
  const {f}=fields();
  const go=$("#go"); go.textContent=editId?"✓":"+"; go.classList.toggle("ready",!!inp.value.trim());
  document.querySelectorAll(".chip").forEach(c=>{const k=c.dataset.k,v=c.dataset.v;c.classList.toggle("on",String(f[k])===v)});
  document.body.classList.toggle("editing",!!editId);
}

/* ---------- actions ---------- */
function addFromLine(line){
  line=line.trim(); if(!line)return;
  const mx=line.match(/^x\s+(.+)/i);
  if(mx){ // tick by text
    const q=mx[1].toLowerCase(); const it=live().find(i=>!i.done&&i.t.toLowerCase().includes(q));
    if(it){it.done=Date.now();touch(it)} return;
  }
  const p=parse(line); const f=Object.assign({o:"",u:0,d:0,s:"",w:"0"},p.f);
  if(!p.title)return;
  S.items.push(mk(p.title,f));
}
function mk(title,f){
  const i={id:uid(),t:title,o:f.o||"",u:+f.u||0,d:+f.d||0,slot:f.s||"",day:f.w==="s"?null:dISO(+f.w||0),done:null,late:0,cr:Date.now()};
  touch(i);return i;
}
function submit(){
  const raw=inp.value;
  if(tryKey(raw)){reset();return}
  if(!editId && raw.includes("\n")){raw.split("\n").forEach(addFromLine);reset();commit();return}
  if(!editId && /^x\s+/i.test(raw.trim())){addFromLine(raw);reset();commit();return}
  const {title,f}=fields();
  if(!title){reset();render();return}
  if(editId){
    const i=S.items.find(x=>x.id===editId);
    if(i){const nd=f.w==="s"?null:(i.day&&((f.w==="0"&&i.day===dISO())||(f.w==="1"&&i.day===dISO(1)))?i.day:dISO(+f.w||0));
      if(nd!==i.day)i.late=0;
      Object.assign(i,{t:title,o:f.o,u:+f.u,d:+f.d,slot:f.s,day:nd});touch(i)}
  } else S.items.push(mk(title,f));
  reset();commit();
}
function reset(){inp.value="";man={};editId=null;inp.blur();paintChips()}
function startEdit(i){
  editId=i.id;
  const w=!i.day?"s":i.day===dISO(1)?"1":"0";
  man={o:i.o||"",u:i.u||0,d:i.d||0,s:i.slot||"",w};
  inp.value=i.t; render(); inp.focus();
}

list.addEventListener("click",e=>{
  if(e.target.closest("#stbyH")){stbyOpen=!stbyOpen;render();return}
  if(e.target.closest(".hd"))return;
  const r=e.target.closest(".row"); if(!r)return;
  const i=S.items.find(x=>x.id===r.dataset.id); if(!i)return;
  if(e.target.closest(".ck")){ i.done=i.done?null:Date.now(); touch(i); if(editId===i.id)reset(); commit(); return }
  if(editId===i.id){reset();render();return}
  startEdit(i);
});
inp.addEventListener("input",paintChips);
inp.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();submit()} if(e.key==="Escape"){reset();render()}});
inp.addEventListener("paste",e=>{
  const t=(e.clipboardData||window.clipboardData).getData("text");
  if(t && tryKey(t)){e.preventDefault();reset();return}
  if(t && t.trim().includes("\n") && !editId){e.preventDefault();t.split(/\r?\n/).forEach(addFromLine);reset();commit()}
});
document.querySelectorAll(".chip").forEach(c=>c.addEventListener("pointerdown",e=>{
  e.preventDefault(); // keep keyboard open
  const k=c.dataset.k; let v=c.dataset.v; if(k==="u"||k==="d")v=+v;
  const {f}=fields(); const def={o:"",u:0,d:0,s:"",w:"0"}[k];
  // strip code from text for this key, then toggle
  const p=parse(inp.value); if(k in p.f){inp.value=stripKey(inp.value,k)}
  man[k]=(String(f[k])===String(v))?def:v;
  paintChips();
}));
function stripKey(txt,k){
  const w=txt.trim().split(/\s+/); const out=[]; let tail=true;
  for(let j=w.length-1;j>=0;j--){const c=CODES[w[j].toLowerCase()]; if(tail&&j>0&&c){if(c[0]===k)continue;out.unshift(w[j])}else{tail=false;out.unshift(w[j])}}
  return out.join(" ");
}
$("#go").addEventListener("click",e=>{e.preventDefault();submit()});
// keep the keyboard open when tapping chips / + on iPhone
// (pointerdown has already fired by touchstart, so only block the focus loss here)
document.querySelectorAll(".chip,#del").forEach(b=>b.addEventListener("touchstart",e=>e.preventDefault(),{passive:false}));
$("#go").addEventListener("touchstart",e=>{e.preventDefault();const was=!editId;submit();if(was)inp.focus()},{passive:false});
$("#del").addEventListener("pointerdown",e=>{e.preventDefault();const i=S.items.find(x=>x.id===editId);if(i){i.del=1;touch(i)}reset();commit()});

/* ---------- drag to reschedule / delete ---------- */
let drag=null;
const trash=$("#trash");
list.addEventListener("pointerdown",e=>{
  const h=e.target.closest(".hd"); if(!h)return;
  e.preventDefault();
  const r=h.closest(".row"); if(!r)return;
  if(editId){reset()}
  const rc=r.getBoundingClientRect();
  const g=r.cloneNode(true); g.classList.add("ghost"); g.style.width=rc.width+"px"; g.style.left=rc.left+"px";
  document.body.appendChild(g);
  drag={id:r.dataset.id,src:r,ghost:g,dy:e.clientY-rc.top,x:e.clientX,y:e.clientY,over:null,pending:false,raf:0};
  r.classList.add("src"); document.body.classList.add("dragging");
  moveGhost(); drag.raf=requestAnimationFrame(autoScroll);
});
function moveGhost(){ if(!drag)return; drag.ghost.style.top=(drag.y-drag.dy)+"px"; hitTest() }
function hitTest(){
  let k=null;
  const tr=trash.getBoundingClientRect();
  if(drag.y>tr.top-20) k="trash";
  else{ const el=document.elementFromPoint(Math.min(Math.max(drag.x,20),innerWidth-20),drag.y); const d=el&&el.closest("[data-drop]"); if(d)k=d.dataset.drop }
  if(k===drag.over)return; drag.over=k;
  document.querySelectorAll(".hov").forEach(x=>x.classList.remove("hov"));
  if(k==="trash")trash.classList.add("hov");
  else if(k) document.querySelectorAll(`.slot[data-drop="${k}"],.dz[data-drop="${k}"],#stbyH[data-drop="${k}"]`).forEach(x=>x.classList.add("hov"));
}
function autoScroll(){
  if(!drag)return;
  const tr=trash.getBoundingClientRect().top;
  let v=0; if(drag.y<90)v=-(90-drag.y)/6; else if(drag.y>tr-110&&drag.y<tr-20)v=(drag.y-(tr-110))/6;
  if(v){window.scrollBy(0,v);hitTest()}
  drag.raf=requestAnimationFrame(autoScroll);
}
window.addEventListener("pointermove",e=>{if(!drag)return;e.preventDefault();drag.x=e.clientX;drag.y=e.clientY;moveGhost()},{passive:false});
function endDrag(apply){
  if(!drag)return;
  const d=drag; drag=null; cancelAnimationFrame(d.raf);
  d.ghost.remove(); document.body.classList.remove("dragging");
  document.querySelectorAll(".hov").forEach(x=>x.classList.remove("hov"));
  const i=S.items.find(x=>x.id===d.id);
  if(apply&&i&&d.over){
    if(d.over==="trash"){i.del=1;touch(i)}
    else{const [w,sl]=d.over.split("|"); const nd=w==="s"?null:dISO(+w);
      if(nd!==i.day||sl!==(i.slot||"")){ if(nd!==i.day)i.late=0; i.day=nd;i.slot=sl;touch(i) }}
    commit(); return;
  }
  render();
}
window.addEventListener("pointerup",()=>endDrag(true));
window.addEventListener("pointercancel",()=>endDrag(false));

/* ---------- GitHub sync ---------- */
const enc=s=>btoa(String.fromCharCode(...new TextEncoder().encode(s)));
const dec=b=>new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\n/g,"")),c=>c.charCodeAt(0)));
let lastErr="";
let syncing=false,again=false,qT=null;
function queueSync(){clearTimeout(qT);qT=setTimeout(sync,1200);setDot()}
function setDot(st){
  const d=$("#dot"); d.className="";
  if(!cfg){return}
  d.classList.add(st||(dirty?"pend":"ok"));
}
function merge(a,b){
  const m=new Map();
  for(const i of [...(a.items||[]),...(b.items||[])]){const o=m.get(i.id);if(!o||(i.up||0)>(o.up||0))m.set(i.id,i)}
  const na=a.note||{t:"",up:0},nb=b.note||{t:"",up:0};
  return {v:1,items:[...m.values()].sort((x,y)=>x.id<y.id?-1:1),note:(nb.up||0)>(na.up||0)?nb:na};
}
const canon=s=>JSON.stringify({v:1,items:[...(s.items||[])].sort((x,y)=>x.id<y.id?-1:1),note:s.note||{t:"",up:0}});
async function sync(){
  if(!cfg)return; if(!navigator.onLine){setDot("pend");return}
  if(syncing){again=true;return} syncing=true;
  const url=`https://api.github.com/repos/${cfg.repo}/contents/tasks.json`;
  const H={Authorization:"Bearer "+cfg.tok,Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"};
  try{
    for(let n=0;n<3;n++){
      const r=await fetch(url+"?t="+Date.now(),{headers:H,cache:"no-store"});
      let remote={v:1,items:[],note:{t:"",up:0}},sha;
      if(r.ok){const j=await r.json();sha=j.sha;remote=JSON.parse(dec(j.content))}
      else {let m="";try{m=(await r.json()).message||""}catch(_){}throw new Error("GET "+r.status+" "+m)}
      const wasDirty=dirty;
      S=merge(S,remote); tidy();
      if(canon(S)===canon(remote)){dirty=false;break}
      const body={message:"update",content:enc(JSON.stringify(S,null,1))}; if(sha)body.sha=sha;
      const p=await fetch(url,{method:"PUT",headers:H,body:JSON.stringify(body)});
      if(p.ok){dirty=false;break}
      if(p.status===409||p.status===422){continue}
      {let m="";try{m=(await p.json()).message||""}catch(_){}throw new Error("PUT "+p.status+" "+m)}
    }
    lastErr="";lastSync=Date.now(); localStorage.setItem(LS+".last",lastSync);
    save(); if(document.activeElement!==inp)render(); setDot();
  }catch(e){console.warn(e);setDot(navigator.onLine?"err":"pend");lastErr=e.message+" @ "+new Date().toLocaleTimeString("en-GB",{timeZone:TZ});}
  finally{syncing=false;if(again){again=false;queueSync()}}
}
function tryKey(raw){ // TODOKEY:owner/repo:token — tolerant of line breaks/spaces
  const s=String(raw).replace(/\s+/g,"");
  if(!/TODOKEY:/i.test(s))return false;
  const m=s.match(/TODOKEY:([^:]+\/[^:]+):([A-Za-z0-9_]+)/i);
  if(!m){alertRow("Key code not recognised");return true}
  cfg={repo:m[1],tok:m[2]};localStorage.setItem(LS+".cfg",JSON.stringify(cfg));
  S.items=S.items.filter(i=>!/github_pat_|TODOKEY/i.test(i.t));save();
  dirty=true;render();sync();alertRow("Key saved — syncing…");return true;
}
function setupFromCode(code){tryKey(code)}
function alertRow(t){$("#note").textContent=t;setTimeout(render,3000)}
$("#dot").addEventListener("click",()=>{
  $("#sRepo").value=cfg?cfg.repo:DEF_REPO; $("#sTok").value=cfg?cfg.tok:"";
  $("#sInfo").textContent=VER+" · "+(cfg?("Last sync: "+(lastSync?new Date(lastSync).toLocaleString("en-GB",{timeZone:TZ}):"never")+(dirty?" · changes waiting":"")):"Not connected — saved on this phone only.")+(lastErr?"  ·  ERROR: "+lastErr:"");
  $("#set").classList.add("show");
});
$("#sClose").onclick=()=>$("#set").classList.remove("show");
$("#sSave").onclick=()=>{const r=$("#sRepo").value.trim()||DEF_REPO,t=$("#sTok").value.trim();
  if(tryKey(t)){$("#set").classList.remove("show");return}
  if(t){cfg={repo:r,tok:t};localStorage.setItem(LS+".cfg",JSON.stringify(cfg));dirty=true}
  else{cfg=null;localStorage.removeItem(LS+".cfg")}
  $("#set").classList.remove("show");setDot();sync()};
$("#sSync").onclick=()=>{$("#set").classList.remove("show");sync()};

/* ---------- iOS home-screen gap fix ----------
   With a translucent status bar, iOS can shorten the app viewport by the status-bar height,
   leaving a dead strip at the bottom. Measure it and push the bottom bar into it. */
function fixGap(){
  let g=0;
  if(navigator.standalone||matchMedia("(display-mode: standalone)").matches){
    const portrait=innerHeight>innerWidth, full=portrait?Math.max(screen.height,screen.width):Math.min(screen.height,screen.width);
    const vv=window.visualViewport, kb=vv&&(innerHeight-vv.height>120); // keyboard open: leave alone
    if(!kb)g=Math.max(0,Math.min(80,full-innerHeight));
  }
  document.documentElement.style.setProperty("--gap",g+"px");
}
fixGap(); addEventListener("resize",fixGap); addEventListener("orientationchange",()=>setTimeout(fixGap,300));
if(window.visualViewport)visualViewport.addEventListener("resize",fixGap);

/* ---------- lifecycle ---------- */
window.addEventListener("online",()=>sync());
window.addEventListener("offline",()=>setDot("pend"));
document.addEventListener("visibilitychange",()=>{if(!document.hidden){render();sync()}});
setInterval(()=>{if(!document.hidden&&document.activeElement!==inp){render();sync()}},25000);
if("serviceWorker" in navigator && window.isSecureContext)navigator.serviceWorker.register("sw.js").catch(()=>{});
render();setDot();sync();
</script>
